<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="author" content="@saklin_01 (GitHub: @saklincodes)">
  <meta name="theme-color" content="#07020d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Us in Cyberpunk</title>
  <style>

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --void: #05010a;
      --ink: #eaffff;
      --cyan: #00f7ff;
      --pink: #ff2bd6;
      --acid: #eaff00;
      --panel: rgba(8, 5, 18, 0.68);
      --line: rgba(0, 247, 255, 0.28);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--void);
      color: var(--ink);
      font-family: "Courier New", "Lucida Console", monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      cursor: crosshair;
    }

    /* Fullscreen Stage (No borders, frames, or boxes) */
    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh; /* fallback */
      height: 100dvh; /* correct size under mobile browser toolbars */
      background:
        radial-gradient(circle at 50% 46%, rgba(123, 0, 255, 0.15), transparent 34%),
        radial-gradient(circle at 12% 20%, rgba(255, 43, 214, 0.08), transparent 23%),
        linear-gradient(180deg, #090315 0%, #030008 62%, #080311 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(90deg, transparent 0 92px, rgba(0,247,255,.035) 93px, transparent 94px),
        repeating-linear-gradient(0deg, transparent 0 92px, rgba(255,43,214,.025) 93px, transparent 94px);
      mask-image: linear-gradient(to bottom, black, transparent 74%);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      opacity: .42;
      background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(0,0,0,.22) 4px 5px);
      animation: scanDrift 9s linear infinite;
    }

    @keyframes scanDrift { to { transform: translateY(5px); } }

    /* SVG Line Art Layer */
    .sketch-svg {
      position: absolute;
      z-index: 2;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      shape-rendering: geometricPrecision;
      filter: saturate(1.12) contrast(1.05);
    }

    /* Crisp Linework (No blurry neon glow, no drop-shadow halos) */
    .layer-phase1 path {
      fill: none;
      stroke: url(#neon-line);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 1;
      filter: url(#cyan-glow);
    }

    /* Group-level glow: ONE filter pass per layer instead of 200+
       per-path drop-shadows — same look, far cheaper on phone GPUs */
    .layer-phase2 path,
    .layer-phase2-alt path {
      fill: none;
      stroke: #85fbff;
      stroke-width: 1px;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.88;
    }

    .layer-phase2 { filter: drop-shadow(0 0 2.5px rgba(0,247,255,.72)); }
    .layer-phase2-alt path { stroke: #ff58df; }
    .layer-phase2-alt { filter: drop-shadow(0 0 2.5px rgba(255,43,214,.6)); }

    /* Star Points */
    .star-point {
      fill: var(--acid);
      opacity: 0.85;
      filter: drop-shadow(0 0 4px var(--acid));
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Precision Pen Tip */
    .pen-cursor {
      pointer-events: none;
      will-change: transform, opacity;
      transition: opacity 0.4s ease-out;
    }

    /* Micro-Sparkle Particle Overlay Canvas */
    .particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Discreet Status Toast (Auto-fades, pristine OLED black aesthetic) */
    .status-toast {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      padding: 6px 14px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(18, 18, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
    }

    .status-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }


    /* Cyberpunk environmental layer */
    .cyber-bg { opacity: .9; }
    .sun-core { fill: url(#sun-gradient); filter: url(#magenta-glow); }
    .sun-cuts line { stroke: #12031d; stroke-width: 7; }
    .city-back { fill: #090413; stroke: rgba(255,43,214,.3); stroke-width: 1; }
    .city-front { fill: #05010b; stroke: rgba(0,247,255,.24); stroke-width: 1; }
    .window-cyan { fill: #00f7ff; opacity: .32; }
    .window-pink { fill: #ff2bd6; opacity: .32; }
    .horizon-line { stroke: #ff2bd6; stroke-width: 1.2; opacity: .65; filter: url(#magenta-glow); }
    .data-dash { stroke: #00f7ff; stroke-width: 1; stroke-dasharray: 4 11; opacity: .24; animation: dashFlow 7s linear infinite; }
    @keyframes dashFlow { to { stroke-dashoffset: -120; } }

    .particle-canvas { z-index: 3; }

    .hud {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 10px;
    }

    .top-rail {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: clamp(18px, 3vw, 46px);
      right: clamp(18px, 3vw, 46px);
      height: 44px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      border-top: 1px solid rgba(0,247,255,.36);
      padding-top: 9px;
    }

    .top-rail::before, .top-rail::after {
      content: "";
      position: absolute;
      top: -2px;
      width: 68px;
      height: 3px;
      background: var(--cyan);
      box-shadow: 0 0 10px rgba(0,247,255,.8);
    }
    .top-rail::before { left: 0; }
    .top-rail::after { right: 0; background: var(--pink); box-shadow: 0 0 10px rgba(255,43,214,.8); }

    .brand-lockup { display: flex; align-items: baseline; gap: 12px; }
    .brand {
      color: #fff;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(20px, 2.6vw, 36px);
      line-height: .82;
      letter-spacing: .04em;
      transform: skewX(-8deg);
      text-shadow: 3px 2px 0 rgba(255,43,214,.8), -2px -1px 0 rgba(0,247,255,.75);
    }
    .brand span { color: var(--acid); }
    .protocol { color: rgba(234,255,255,.46); font-size: 8px; letter-spacing: .24em; }
    .link-state { color: var(--acid); white-space: nowrap; }
    .link-state::before {
      content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 8px;
      border-radius: 50%; background: var(--acid); box-shadow: 0 0 8px var(--acid);
      animation: pulse 1.5s steps(2) infinite;
    }
    @keyframes pulse { 50% { opacity: .25; } }

    .side-card {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 158px;
      padding: 13px 14px 15px;
      background: linear-gradient(135deg, rgba(6,3,15,.76), rgba(11,4,25,.42));
      border: 1px solid rgba(0,247,255,.23);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 13px, 100% 100%, 13px 100%, 0 calc(100% - 13px));
    }
    .side-card.left { left: clamp(18px, 3vw, 46px); }
    .side-card.right { right: clamp(18px, 3vw, 46px); border-color: rgba(255,43,214,.25); }
    .card-eyebrow { color: var(--pink); font-size: 8px; margin-bottom: 10px; }
    .card-value { color: #fff; font: 24px/1 Impact, sans-serif; letter-spacing: .04em; margin-bottom: 8px; }
    .card-meta { color: rgba(234,255,255,.42); font-size: 8px; line-height: 1.8; }
    .meter { height: 2px; background: rgba(255,255,255,.08); margin-top: 11px; overflow: hidden; }
    .meter i { display: block; width: 72%; height: 100%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: meter 3.2s ease-in-out infinite alternate; }
    .right .meter i { width: 44%; background: var(--pink); box-shadow: 0 0 8px var(--pink); animation-delay: -1s; }
    @keyframes meter { to { width: 92%; } }

    .coordinates {
      position: absolute;
      left: clamp(18px, 3vw, 46px);
      bottom: max(30px, env(safe-area-inset-bottom));
      color: rgba(234,255,255,.42);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      line-height: 1.7;
    }

    .bottom-rail {
      position: absolute;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(560px, calc(100vw - 120px));
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 15px;
      background: rgba(5,1,10,.66);
      border-left: 2px solid var(--pink);
      border-right: 2px solid var(--cyan);
      clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .refresh-button {
      appearance: none;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--acid);
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      white-space: nowrap;
      cursor: pointer;
      pointer-events: auto;
    }
    .refresh-button:hover { color: #fff; text-shadow: 0 0 8px var(--acid); }
    .refresh-button:focus-visible { outline: 1px solid var(--acid); outline-offset: 4px; }
    .pause-button { min-width: 76px; text-align: center; }
    .progress-track { flex: 1; height: 1px; background: rgba(234,255,255,.15); position: relative; }
    .progress-track::before { content: ""; position: absolute; inset: -1px auto -1px 0; width: var(--trace-progress, 0%); background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    .timecode { color: rgba(234,255,255,.5); white-space: nowrap; }

    .glitch-tag {
      position: absolute;
      top: 23%; right: 15%;
      color: rgba(255,43,214,.22);
      font: 700 clamp(34px, 7vw, 104px)/.8 Impact, sans-serif;
      letter-spacing: -.02em;
      transform: rotate(-90deg);
      transform-origin: right top;
      mix-blend-mode: screen;
    }

    .corner { position: absolute; width: 24px; height: 24px; opacity: .7; }
    .corner::before, .corner::after { content:""; position:absolute; background:var(--cyan); }
    .corner::before { width:100%; height:1px; } .corner::after { width:1px; height:100%; }
    .c1 { left:14px; top:14px; } .c2 { right:14px; top:14px; transform:scaleX(-1); }
    .c3 { left:14px; bottom:14px; transform:scaleY(-1); } .c4 { right:14px; bottom:14px; transform:scale(-1); }

    .status-toast {
      bottom: 78px;
      color: var(--acid);
      background: rgba(8, 3, 16, 0.9);
      border: 1px solid rgba(234,255,0,.38);
      border-radius: 0;
      clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%);
      z-index: 10;
    }

    @media (max-width: 820px) {
      /* Side cards become compact HUD chips under the top rail so the
         names + location stay on screen on phones */
      .side-card {
        top: calc(72px + env(safe-area-inset-top));
        transform: none;
        width: auto;
        max-width: 52%;
        padding: 7px 10px 8px;
        display: flex;
        align-items: baseline;
        gap: 7px;
        flex-wrap: wrap;
      }
      .side-card.left { left: 14px; }
      .side-card.right { right: 14px; justify-content: flex-end; text-align: right; }
      .side-card { max-width: 48%; }
      .card-eyebrow { margin-bottom: 0; }
      .card-value { font-size: clamp(10px, 3.2vw, 13px); margin-bottom: 0; }
      .card-meta { font-size: 8px; line-height: 1.35; }
      .card-meta br, .card-meta .meta-q { display: none; }
      .meter { display: none; }

      .glitch-tag { right: 7%; opacity: .55; }
      .protocol { display: none; }
      .bottom-rail { width: min(560px, calc(100vw - 40px)); bottom: max(20px, env(safe-area-inset-bottom)); }
      .coordinates { display: none; }

      /* Keep hairlines visible when the artwork is scaled way down:
         strokes stop shrinking with the viewBox on small screens */
      .layer-phase1 path,
      .layer-phase2 path,
      .layer-phase2-alt path,
      .horizon-line,
      .data-dash,
      .city-back,
      .city-front { vector-effect: non-scaling-stroke; }
    }

    @media (max-width: 520px) {
      .top-rail { top: max(16px, env(safe-area-inset-top)); align-items: flex-start; }
      .brand { font-size: 22px; }
      .brand-lockup { gap: 4px; flex-direction: column; }
      .link-state { font-size: 8px; margin-top: 2px; }
      .bottom-rail { font-size: 8px; gap: 9px; padding-inline: 12px; }
      .pause-button { min-width: 58px; }
      .timecode { display: none; }
      .glitch-tag { top: 20%; right: 0; }
      .side-card { max-width: 48%; gap: 5px; padding: 6px 8px 7px; }
    }

    /* Narrow phones: stack the two HUD chips top-left so they never collide */
    @media (max-width: 460px) {
      .side-card { max-width: 78%; }
      .side-card.right {
        left: 14px;
        right: auto;
        top: calc(112px + env(safe-area-inset-top));
        justify-content: flex-start;
        text-align: left;
      }
    }

    /* Phones turned sideways / short landscape windows */
    @media (max-height: 520px) and (orientation: landscape) {
      .top-rail { height: 34px; padding-top: 6px; }
      .brand { font-size: clamp(16px, 4.4vh, 22px); }
      .glitch-tag { display: none; }
      .coordinates { display: none; }
      .side-card {
        top: auto;
        bottom: calc(62px + env(safe-area-inset-bottom));
        transform: none;
        width: auto;
        max-width: 34vw;
        padding: 8px 11px 9px;
      }
      .card-value { font-size: 14px; }
      .meter { display: none; }
      .bottom-rail {
        width: min(480px, calc(100vw - 380px));
        bottom: max(12px, env(safe-area-inset-bottom));
        padding: 6px 12px;
      }
      .status-toast { bottom: 54px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage::after, .data-dash, .link-state::before, .meter i, .progress-track::before { animation: none; }
    }

  </style>
</head>
<body>
  <noscript>
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05010a;color:#eaffff;font:14px 'Courier New',monospace;padding:24px;text-align:center;z-index:99">
      This sketch animation needs JavaScript enabled.
    </div>
  </noscript>
  <!-- Fullscreen Animation Stage -->
  <div id="stage" class="stage" role="region" aria-label="Neon Ronin Cyberpunk Sketch Animation">
    <!-- SVG Line Art Layer -->
    <svg id="sketch-svg" class="sketch-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <!-- Subtle linear gradient for pen tip micro-illumination (crisp, zero neon glow) -->
        <radialGradient id="pen-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#eaff00" stop-opacity="1" />
          <stop offset="45%" stop-color="#00f7ff" stop-opacity="0.86" />
          <stop offset="100%" stop-color="#00f7ff" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="neon-line" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#00f7ff" />
          <stop offset="0.55" stop-color="#dffeff" />
          <stop offset="1" stop-color="#ff2bd6" />
        </linearGradient>
        <linearGradient id="sun-gradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff2bd6" />
          <stop offset="1" stop-color="#7824ff" />
        </linearGradient>
        <filter id="cyan-glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="2.1" result="blur" />
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="magenta-glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Cyber city atmosphere -->
      <g class="cyber-bg" aria-hidden="true">
        <circle class="sun-core" cx="1260" cy="260" r="118" />
        <g class="sun-cuts">
          <line x1="1130" y1="218" x2="1390" y2="218" />
          <line x1="1130" y1="244" x2="1390" y2="244" />
          <line x1="1130" y1="274" x2="1390" y2="274" />
          <line x1="1130" y1="310" x2="1390" y2="310" />
        </g>
        <path class="city-back" d="M0 665V548h54v-72h38v99h54V432h75v173h45V514h58v91h53V458h49v207H0ZM1198 665V510h48v-84h58v134h51V482h83v-63h42v122h51v-95h70v219Z" />
        <path class="city-front" d="M0 824V648h84v-62h43v91h64v-138h76v285H0ZM1340 824V640h63v-119h84v171h46v-94h139v226Z" />
        <g>
          <rect class="window-cyan" x="158" y="466" width="8" height="21"/><rect class="window-pink" x="181" y="466" width="8" height="21"/>
          <rect class="window-cyan" x="158" y="505" width="8" height="21"/><rect class="window-pink" x="181" y="505" width="8" height="21"/>
          <rect class="window-pink" x="389" y="485" width="7" height="28"/><rect class="window-cyan" x="407" y="485" width="7" height="28"/>
          <rect class="window-pink" x="1415" y="551" width="9" height="26"/><rect class="window-cyan" x="1440" y="551" width="9" height="26"/>
          <rect class="window-cyan" x="1525" y="480" width="9" height="28"/><rect class="window-pink" x="1550" y="480" width="9" height="28"/>
        </g>
        <line class="horizon-line" x1="0" y1="824" x2="1672" y2="824"/>
        <path class="data-dash" d="M40 180 H440 M1225 410 H1600 M70 360 H300 M1370 150 H1620" />
      </g>

      <!-- Phase 1 Layer: Continuous Outer Silhouette (~7.5s) -->
      <g id="layer-phase1" class="layer-phase1"></g>

      <!-- Phase 2 Layer: Essential Structural Details (~4.2s) -->
      <g id="layer-phase2" class="layer-phase2"></g>
      <g id="layer-phase2-alt" class="layer-phase2-alt"></g>

      <!-- Stars Layer -->
      <g id="layer-stars" class="layer-stars"></g>
      <g id="layer-sky-stars" class="layer-stars"></g>

      <!-- Precision Pen Tip Cursor -->
      <g id="pen-cursor" class="pen-cursor" opacity="0">
        <circle id="pen-halo" cx="0" cy="0" r="4.5" fill="url(#pen-glow)" />
        <circle id="pen-dot" cx="0" cy="0" r="1.8" fill="#eaff00" />
      </g>
    </svg>

    <!-- Canvas Layer for Fast Micro-Sparkle Particle Trail -->
    <canvas id="particle-canvas" class="particle-canvas" aria-hidden="true"></canvas>

    <div class="hud" aria-hidden="true">
      <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
      <header class="top-rail">
        <div class="brand-lockup">
          <div class="brand">Me<span>&</span>You</div>
          <div class="protocol">In cyberpunk evening</div>
        </div>
        <div class="link-state">Offline</div>
      </header>

      <aside class="side-card left">
        <div class="card-eyebrow">Who?</div>
        <div class="card-value">Us</div>
        <div class="card-meta"><span class="meta-q">Us who ?</span> <br><br> <span class="names">Lokesh &amp; Racchu</span> </div>
        <div class="meter"><i></i></div>
      </aside>

      <aside class="side-card right">
        <div class="card-eyebrow">Where?</div>
        <div class="card-value">Top of Quantum's Main Building</div>
        <div class="card-meta">Under the stars</div>
        <div class="meter"><i></i></div>
      </aside>

      <div class="coordinates">30.3165° N &nbsp; 78.0322° E &nbsp; // &nbsp; Q-Library</div>
      <div class="glitch-tag">NIGHT<br>CITY</div>

      <footer class="bottom-rail">
        <button id="refresh-button" class="refresh-button" type="button" aria-label="Restart animation">[ REFRESH ]</button>
        <button id="pause-button" class="refresh-button pause-button" type="button" aria-label="Pause or resume animation">[ PAUSE ]</button>
        <span class="progress-track"></span>
        <span id="timecode" class="timecode">11.82 SEC</span>
      </footer>
    </div>

    <!-- Discreet HUD Toast for Status / Shortcuts -->
    <div id="status-toast" class="status-toast" aria-live="polite"></div>
  </div>

  <script>
    /**
     * Midnight Rooftop — Minimalist 2-Phase SVG Sketch Animation
     * Author: @saklin_01 (GitHub: @saklincodes)
     * Standalone Vanilla JavaScript • Zero External Dependencies
     */

    (function () {
      'use strict';

      // --- ARTWORK PATH DATASET ---

      function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

      // Small deterministic PRNG so the extra portrait stars are identical on every load
      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function setupResponsiveViewBox() {
        const w = window.innerWidth || 1;
        const h = window.innerHeight || 1;
        const aspect = w / h;
        const baseAspect = CONFIG.baseWidth / CONFIG.baseHeight;
        let vb;

        if (aspect < 1) {
          // Portrait (phones / reels): tall slice centred on the couple,
          // horizon pinned at 72% so sun, city and stars stay in frame
          const vw = CONFIG.portraitWidth;
          const vh = vw / aspect;
          vb = {
            x: CONFIG.focusX - vw / 2,
            y: CONFIG.groundY - vh * 0.72,
            w: vw,
            h: vh
          };
        } else if (aspect > baseAspect) {
          // Wider than 16:9 (phone landscape → ultrawide): keep full width,
          // crop height while the couple still fits; otherwise show everything
          const vh = CONFIG.baseWidth / aspect;
          if (vh >= (CONFIG.groundY - CONFIG.headY) + 60) {
            let minY = CONFIG.groundY - vh * 0.87;
            minY = Math.min(minY, CONFIG.headY - 20);       // never cut the heads
            minY = Math.max(minY, CONFIG.groundY - vh + 8); // never cut the ground
            vb = { x: 0, y: minY, w: CONFIG.baseWidth, h: vh };
          } else {
            vb = { x: 0, y: 0, w: CONFIG.baseWidth, h: CONFIG.baseHeight };
          }
        } else {
          // Landscape but narrower than 16:9 (e.g. 4:3 tablet/desktop):
          // keep full height, crop the sides symmetrically around the couple
          const vw = clamp(CONFIG.baseHeight * aspect, 1180, CONFIG.baseWidth);
          const minX = clamp(CONFIG.focusX - vw / 2, 0, CONFIG.baseWidth - vw);
          vb = { x: minX, y: 0, w: vw, h: CONFIG.baseHeight };
        }

        currentViewBox = vb;
        currentScale = w / vb.w;
        currentAspect = aspect;
        svg.setAttribute('viewBox',
          `${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`);
        applyScaleTweaks(currentScale, aspect);
      }

      // Keep the pen tip and stars usable when the artwork is scaled far
      // down (small phones) — sizes compensate in screen pixels.
      function applyScaleTweaks(scale, aspect) {
        if (penHalo) penHalo.setAttribute('r', clamp(4 / scale, 4.5, 11).toFixed(2));
        if (penDot) penDot.setAttribute('r', clamp(1.6 / scale, 1.8, 4.6).toFixed(2));
        const boost = scale < 0.7 ? clamp(0.72 / scale, 1, 2.2) : 1;
        starElements.forEach((el, i) => {
          const st = ART_DATA.stars[i];
          if (st) el.setAttribute('r', (st.s * boost).toFixed(2));
        });
        updateSkyStars(aspect, boost);
      }

      // Portrait screens show a lot of empty sky above the couple —
      // sprinkle extra faint stars so the composition stays balanced.
      function updateSkyStars(aspect, boost) {
        if (!layerSkyStars) return;
        layerSkyStars.innerHTML = '';
        skyStarElements = [];
        if (aspect >= 1) return;

        const rnd = mulberry32(77311);
        const vb = currentViewBox;
        const x0 = vb.x + 26, x1 = vb.x + vb.w - 26;
        const y0 = vb.y + 30;
        const y1 = Math.min(vb.y + vb.h * 0.42, 258);
        if (y1 <= y0) return;

        let placed = 0, tries = 0;
        while (placed < 26 && tries < 400) {
          tries++;
          const x = x0 + rnd() * (x1 - x0);
          const y = y0 + rnd() * (y1 - y0);
          const dx = x - 1260, dy = y - 260;
          if (dx * dx + dy * dy < 175 * 175) continue; // keep the sun disc clean
          const c = document.createElementNS(SVGNS, 'circle');
          c.setAttribute('cx', x.toFixed(1));
          c.setAttribute('cy', y.toFixed(1));
          c.setAttribute('r', ((1.1 + rnd() * 1.4) * boost).toFixed(2));
          c.setAttribute('class', 'star-point');
          c.style.opacity = String(currentStarOpacity);
          layerSkyStars.appendChild(c);
          skyStarElements.push(c);
          placed++;
        }
      }

        particleCanvas.style.width = window.innerWidth + 'px';
        particleCanvas.style.height = window.innerHeight + 'px';
        ctx.scale(dpr, dpr);
      }

      // --- BUILD SVG ELEMENTS ---
      function buildSvgElements() {
        layerPhase1.innerHTML = '';
        layerPhase2.innerHTML = '';
        layerPhase2Alt.innerHTML = '';
        layerStars.innerHTML = '';

        // Phase 1 Silhouette
        const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p1.setAttribute('d', ART_DATA.phase1);
        p1.setAttribute('id', 'path-silhouette');
        layerPhase1.appendChild(p1);
        phase1Element = p1;
        phase1Length = p1.getTotalLength();
        p1.style.strokeDasharray = `${phase1Length} ${phase1Length}`;
        p1.style.strokeDashoffset = `${phase1Length}`;

        // Phase 2 Details
        phase2Metrics = [];
        const elements = [];
        let totalLen = 0;

        // Same pink-accent set the old CSS nth-child(6n+2)/(9n+5) rules picked
        // (1-based child order), now routed into a second group so each colour
        // needs only ONE glow filter for the whole layer.
        const isAccent = (idx) => (idx % 6 === 1) || (idx % 9 === 4);

        ART_DATA.phase2.forEach((dStr, idx) => {
          const p2 = document.createElementNS(SVGNS, 'path');
          p2.setAttribute('d', dStr);
          p2.setAttribute('id', `path-detail-${idx}`);
          (isAccent(idx) ? layerPhase2Alt : layerPhase2).appendChild(p2);

          const len = p2.getTotalLength();
          p2.style.strokeDasharray = `${len} ${len}`;
          p2.style.strokeDashoffset = `${len}`;
          elements.push(p2);
          totalLen += len;
        });

        let currentCum = 0;
        elements.forEach((el) => {
          const len = el.getTotalLength();
          const duration = (len / (totalLen || 1)) * CONFIG.phase2Duration;
          phase2Metrics.push({ el, len, start: currentCum, end: currentCum + duration, duration, state: 0 });
          currentCum += duration;
        });

        // Stars
        starElements = [];
        ART_DATA.stars.forEach((st, idx) => {
          const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          c.setAttribute('cx', st.x);
          c.setAttribute('cy', st.y);
          c.setAttribute('r', st.s);
          c.setAttribute('class', 'star-point');
          c.setAttribute('id', `star-${idx}`);
          c.style.opacity = String(currentStarOpacity);
          layerStars.appendChild(c);
          starElements.push(c);
        });

        // Re-apply scale-dependent sizes now that the elements exist
        applyScaleTweaks(currentScale, currentAspect);
      }

      function getScreenCoords(svgPoint) {
        const pt = svg.createSVGPoint();
        pt.x = svgPoint.x;
        pt.y = svgPoint.y;
        const ctm = svg.getScreenCTM();
        return ctm ? pt.matrixTransform(ctm) : { x: 0, y: 0 };
      }

      // --- MICRO-SPARKLE PARTICLES ---
      function emitMicroSparkle(svgPoint) {
        if (particles.length >= MAX_PARTICLES) return;
        const screenPt = getScreenCoords(svgPoint);
        const count = Math.random() < 0.6 ? 2 : 1;
        for (let i = 0; i < count; i++) {
          particles.push({
            x: screenPt.x + (Math.random() - 0.5) * 3,
            y: screenPt.y + (Math.random() - 0.5) * 3,
            vx: (Math.random() - 0.5) * 0.7,
            vy: (Math.random() - 0.5) * 0.7 - 0.2,
            life: 1.0,
            decay: 0.035 + Math.random() * 0.04,
            radius: 0.6 + Math.random() * 1.15,
            tint: Math.random() > 0.72 ? '#ff2bd6' : (Math.random() > 0.9 ? '#eaff00' : '#00f7ff')
          });
        }
      }

      function updateParticles() {
        ctx.clearRect(0, 0, particleCanvas.width / dpr, particleCanvas.height / dpr);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = p.life * 0.75;
          ctx.fillStyle = p.tint || '#00f7ff';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // --- PEN TIP CONTROLLER ---
      function setPenPosition(svgPoint) {
        penCursor.setAttribute('transform', `translate(${svgPoint.x}, ${svgPoint.y})`);
        penCursor.style.opacity = '1';
        emitMicroSparkle(svgPoint);
      }

      function hidePen() {
        penCursor.style.opacity = '0';
      }

      // --- ANIMATION ENGINE ---
      function startAnimation() {
        if (rafId) cancelAnimationFrame(rafId);
        isPaused = false;
        isRunning = true;
        pausedElapsed = 0;
        particles.length = 0;
        stage.style.setProperty('--trace-progress', '0%');

        phase1Element.style.strokeDashoffset = `${phase1Length}`;
        phase2Metrics.forEach(m => { m.el.style.strokeDashoffset = `${m.len}`; m.state = 0; });
        currentStarOpacity = 0;
        forEachStar(s => s.style.opacity = '0');
        lastTimecodeText = '';
        updateTimecode(0);

        const startPt = phase1Element.getPointAtLength(0);
        penCursor.setAttribute('transform', `translate(${startPt.x}, ${startPt.y})`);
        penCursor.style.opacity = '1';

        animationStartTime = performance.now();
        rafId = requestAnimationFrame(animateLoop);
      }

      function animateLoop(now) {
        if (!isRunning || isPaused) {
          updateParticles();
          if (isPaused) rafId = requestAnimationFrame(animateLoop);
          return;
        }

        const elapsed = now - animationStartTime + pausedElapsed;
        const p1Dur = CONFIG.phase1Duration;
        const delay = CONFIG.transitionDelay;
        const p2Dur = CONFIG.phase2Duration;
        const total = p1Dur + delay + p2Dur;
        stage.style.setProperty('--trace-progress', `${Math.min(100, (elapsed / total) * 100)}%`);
        updateTimecode(elapsed);

        if (elapsed < p1Dur) {
          // Phase 1: Continuous Outer Silhouette (~7.5s)
          const progress = Math.min(1, Math.max(0, elapsed / p1Dur));
          const ease = progress < 0.05 ? (progress / 0.05) ** 2 * 0.05 : progress;
          const currentDist = ease * phase1Length;
          phase1Element.style.strokeDashoffset = `${phase1Length - currentDist}`;
          setPenPosition(phase1Element.getPointAtLength(currentDist));

        } else if (elapsed < p1Dur + delay) {
          // Transition breath
          phase1Element.style.strokeDashoffset = '0';
          if (phase2Metrics[0]) {
            setPenPosition(phase2Metrics[0].el.getPointAtLength(0));
          }

        } else if (elapsed < total) {
          // Phase 2: Rich Manga Linework Details (~4.2s)
          phase1Element.style.strokeDashoffset = '0';
          const p2Elapsed = elapsed - (p1Dur + delay);
          let activePenPt = null;

          for (let i = 0; i < phase2Metrics.length; i++) {
            const m = phase2Metrics[i];
            if (p2Elapsed <= m.start) {
              if (m.state !== 0) { m.el.style.strokeDashoffset = `${m.len}`; m.state = 0; }
            } else if (p2Elapsed >= m.end) {
              if (m.state !== 2) { m.el.style.strokeDashoffset = '0'; m.state = 2; }
            } else {
              m.state = 1;
              const strokeProgress = (p2Elapsed - m.start) / (m.duration || 1);
              const currentDist = Math.min(m.len, Math.max(0, strokeProgress * m.len));
              m.el.style.strokeDashoffset = `${m.len - currentDist}`;
              activePenPt = m.el.getPointAtLength(currentDist);
            }
          }

          if (activePenPt) {
            setPenPosition(activePenPt);
          } else {
            for (let i = phase2Metrics.length - 1; i >= 0; i--) {
              if (p2Elapsed >= phase2Metrics[i].end) {
                setPenPosition(phase2Metrics[i].el.getPointAtLength(phase2Metrics[i].len));
                break;
              }
            }
          }

          // Illuminate stars towards end of Phase 2
          const starProgress = Math.max(0, (p2Elapsed - (p2Dur * 0.65)) / (p2Dur * 0.35));
          if (starProgress > 0) {
            currentStarOpacity = Math.min(0.85, starProgress * 0.85);
            forEachStar(st => st.style.opacity = String(currentStarOpacity));
          }

        } else {
          // Finished
          phase1Element.style.strokeDashoffset = '0';
          phase2Metrics.forEach(m => { m.el.style.strokeDashoffset = '0'; m.state = 2; });
          currentStarOpacity = 0.85;
          forEachStar(st => st.style.opacity = '0.85');
          hidePen();
          isRunning = false;
        }

        updateParticles();
        if (isRunning || particles.length > 0) {
          rafId = requestAnimationFrame(animateLoop);
        }
      }

      // --- CONTROLS ---
      function togglePause() {
        if (!isRunning && pausedElapsed === 0) {
          startAnimation();
          showToast('FEED // ONLINE');
          return;
        }
        if (isPaused) {
          isPaused = false;
          animationStartTime = performance.now();
          showToast('TRACE // RESUMED');
          setPauseLabel();
          rafId = requestAnimationFrame(animateLoop);
        } else {
          isPaused = true;
          pausedElapsed += performance.now() - animationStartTime;
          showToast('TRACE // PAUSED');
          setPauseLabel();
        }
      }

      function restartAnimation() {
        isPaused = false;
        autoPaused = false;
        startAnimation();
        setPauseLabel();
        showToast('PROTOCOL // RESTARTED');
      }

      function showToast(text, ms) {
        if (!statusToast) return;
        statusToast.textContent = text;
        statusToast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => statusToast.classList.remove('visible'), ms || 1200);
      }

      function setPauseLabel() {
        if (!pauseButton) return;
        pauseButton.textContent = isPaused ? '[ PLAY ]' : '[ PAUSE ]';
      }

      function totalDuration() {
        return CONFIG.phase1Duration + CONFIG.transitionDelay + CONFIG.phase2Duration;
      }

      function updateTimecode(elapsedMs) {
        if (!timecodeEl) return;
        const text = (clamp(elapsedMs, 0, totalDuration()) / 1000).toFixed(2) + ' SEC';
        if (text !== lastTimecodeText) {
          timecodeEl.textContent = text;
          lastTimecodeText = text;
        }
      }

      // Reduced-motion fallback: show the finished artwork immediately
      function renderFinalState() {
        if (!phase1Element) return;
        phase1Element.style.strokeDashoffset = '0';
        phase2Metrics.forEach(m => { m.el.style.strokeDashoffset = '0'; m.state = 2; });
        currentStarOpacity = 0.85;
        forEachStar(s => s.style.opacity = '0.85');
        hidePen();
        isRunning = false;
        stage.style.setProperty('--trace-progress', '100%');
        updateTimecode(totalDuration());
      }

      // --- EVENT LISTENERS ---
      function setupEventListeners() {
        refreshButton.addEventListener('click', (e) => { e.stopPropagation(); restartAnimation(); });
        if (pauseButton) {
          pauseButton.addEventListener('click', (e) => { e.stopPropagation(); togglePause(); });
        }

        // Tap/click anywhere on the stage pauses & resumes (touch-friendly)
        stage.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          togglePause();
        });

        window.addEventListener('keydown', (e) => {
          // Let a focused button handle its own Space/Enter natively
          if (e.target.closest && e.target.closest('button')) return;
          if (e.code === 'Space' || e.key === ' ') {
            e.preventDefault();
            togglePause();
          }
        });

        // Auto-pause when the tab/app is backgrounded so the trace
        // doesn't jump forward when the user returns
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            if (isRunning && !isPaused) {
              isPaused = true;
              autoPaused = true;
              pausedElapsed += performance.now() - animationStartTime;
              setPauseLabel();
            }
          } else if (autoPaused) {
            autoPaused = false;
            isPaused = false;
            animationStartTime = performance.now();
            setPauseLabel();
            rafId = requestAnimationFrame(animateLoop);
          }
        });

        let resizeTimer = null;
        const onResize = () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            setupResponsiveViewBox();
            setupCanvas();
          }, 120);
        };
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', onResize);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
